[package]
name = "pix"
version = "0.2.0"
edition = "2024"
description = "Minimal fullscreen transparent image viewer"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
# Fast SIMD decoders for the common formats (same stack as rust-image-viewer).
zune-core = "0.5"
zune-image = { version = "0.5", default-features = false, features = ["jpeg", "png", "bmp", "simd"] }
# SIMD resize, used only when an image exceeds the GPU texture limit.
fast_image_resize = "6.0"
# Zero-copy file reads.
memmap2 = "0.9"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }

# Embeds the icon into pix.exe (see build.rs). Only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

